name: release-binaries

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
      nsight_aftermath:
        description: Build Windows with Nsight Aftermath GPU crash dumps (test builds only, no NVIDIA files shipped)
        type: boolean
        default: false
  push:
    branches:
      - nx2-experimental
    # A binary only changes when build inputs change; docs-only pushes skip the build.
    paths:
      - "src/**"
      # Test-only changes cannot change a binary: the build configures with BUILD_TESTING=OFF and
      # LICHII_TESTS=OFF below, so a push that only touches src/tests has nothing to rebuild.
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - "*.profdata"
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

# A running build is never cancelled: it finishes and publishes. A push meanwhile queues one build;
# a later push replaces it, so the newest commit builds as soon as the running one is done.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refuse to publish an Aftermath build
        if: inputs.nsight_aftermath && inputs.publish_release
        run: |
          echo "nsight_aftermath builds are test builds; run them with publish_release=false"
          exit 1

      - name: Prepare release tag
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: ${{ matrix.platform }} binary
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        # This fork ships Windows builds only: Linux and macOS targets are removed.
        include:
          - platform: windows-x86_64
            runner: windows-2022
          # clang-cl with ThinLTO, plus lichii-windows.profdata, an MSVC-ABI profile trained on
          # Ocarina of Time (see docs/CI.md). MSVC still builds for development.
          - platform: windows-x86_64-pgo
            runner: windows-2022
            pgo: true
            profile: lichii-windows.profdata

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.profile || 'eglantine.profdata' }}"

      - name: Set up MSVC
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      # clang-cl compiles against the MSVC headers, libraries and SDK that the previous step put
      # on PATH; only the compiler, linker and archiver come from this LLVM.
      - name: Install LLVM on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt on Windows
        if: startsWith(matrix.platform, 'windows')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      # ccache does not handle MSVC-style command lines well, so the clang-cl job uses sccache. The
      # other jobs use ccache, which CMake enables through USE_CCACHE
      # (externals/cmake-modules/UseCcache.cmake).
      - name: Install sccache on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: glslangValidator --version

      # Only the SDK's headers are kept: the tracker loads GFSDK_Aftermath_Lib.x64.dll at run time,
      # so the tester supplies his own copy and the artifact holds no NVIDIA files.
      - name: Fetch Nsight Aftermath SDK headers
        if: startsWith(matrix.platform, 'windows') && inputs.nsight_aftermath
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'aftermath-sdk.zip'
          Invoke-WebRequest -OutFile $zip https://developer.nvidia.com/downloads/assets/tools/secure/nsight-aftermath-sdk/2026_3_0/windows_x64/NVIDIA_Nsight_Aftermath_SDK_2026.3.0.26197-windows_x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'e38136a60110199559b7365d3ea4ec0cb5588dc2b0f593877d864e0299659a3f') {
            throw "Nsight Aftermath SDK hash $hash does not match the pinned release"
          }
          $extracted = Join-Path $env:RUNNER_TEMP 'aftermath-sdk-zip'
          Expand-Archive $zip -DestinationPath $extracted
          $sdk = Join-Path $env:RUNNER_TEMP 'aftermath-sdk'
          New-Item -ItemType Directory -Force $sdk | Out-Null
          Move-Item (Join-Path $extracted 'include') $sdk
          Remove-Item -Recurse -Force $extracted, $zip
          "NSIGHT_AFTERMATH_SDK=$($sdk -replace '\\', '/')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .sccache
          # The profile's hash is part of the key, so objects built against an older profile are
          # never restored.
          key: objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-

      - name: Configure Windows
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          if [ -n '${{ matrix.profile }}' ]; then
            flags+=" -fprofile-use=$(cygpath -m "$PWD/${{ matrix.profile }}")"
            flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
            flags+=" -Wno-error=backend-plugin"
          fi
          aftermath=()
          if [ '${{ inputs.nsight_aftermath }}' = true ]; then
            aftermath=(-DENABLE_NSIGHT_AFTERMATH=ON)
          fi
          cmake -S . -B build/release -G Ninja "${aftermath[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLICHII_TESTS=OFF \
            -DLICHII_CMD=ON \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=build-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /OPT:REF /OPT:ICF" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          if command -v ccache > /dev/null; then ccache --zero-stats; else sccache --zero-stats; fi
          targets="lichii lichii-cmd"
          if [[ "${{ matrix.platform }}" == windows* ]]; then targets="$targets lichii-updater"; fi
          cmake --build build/release --target $targets --parallel
          if command -v ccache > /dev/null; then ccache --show-stats; else sccache --show-stats; fi

      - name: Stop sccache on Windows
        if: always() && startsWith(matrix.platform, 'windows') && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package Windows binary
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          # Symbols ship as their own artifact, not in the release zip.
          New-Item -ItemType Directory -Force build/release/symbols | Out-Null
          Move-Item build/release/bin/*.pdb build/release/symbols/
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if (Get-ChildItem -Recurse build/release/bin -Filter 'GFSDK_*') {
            throw 'build/release/bin holds Nsight Aftermath files, which must not ship'
          }

      - name: Upload Windows binary
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ matrix.platform }}${{ inputs.nsight_aftermath && '-aftermath' || '' }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows symbols
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.platform }}${{ inputs.nsight_aftermath && '-aftermath' || '' }}-${{ github.sha }}
          path: build/release/symbols/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: lichii-*-${{ github.sha }}
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          # Asset names drop the commit sha: the release tag already identifies the build, and
          # stable names let the notes table link to them.
          strip_sha() { sed "s/-${GITHUB_SHA}//" <<< "$1"; }
          for artifact in artifacts/*/; do
            name=$(basename "$artifact")
            # Windows artifacts are the contents of build/release/bin; zip them under the
            # release name.
            (cd "$artifact" && zip -qr "${GITHUB_WORKSPACE}/dist/$(strip_sha "$name").zip" .)
          done
          ls -la dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/build-${GITHUB_RUN_NUMBER}" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag build-${GITHUB_RUN_NUMBER} points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          tag="build-${GITHUB_RUN_NUMBER}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          link() { [[ -e "dist/$2" ]] && echo "[$1](${base}/$2)" || true; }
          has_pgo=$(compgen -G 'dist/*-pgo.*' || true)
          row() {
            [[ -z "$2$3" ]] && return 0
            if [[ -n "$has_pgo" ]]; then echo "| $1 | $2 | $3 | $4 |"; else echo "| $1 | $2 | $4 |"; fi
          }
          table() {
            local rows
            rows=$(cat)
            [[ -z "$rows" ]] && return 0
            if [[ -n "$has_pgo" ]]; then
              printf '| Build Type | Standard | PGO (Recommended) | Notes |\n| --- | --- | --- | --- |\n'
            else
              printf '| Build Type | Standard | Notes |\n| --- | --- | --- |\n'
            fi
            echo "$rows"
          }
          pgo_note=""
          if [[ -n "$has_pgo" ]]; then
            pgo_note="The PGO build is the same program compiled with profile-guided optimization: clang-cl and ThinLTO with a profile trained in Lichii on Ocarina of Time, so other games gain less. Prefer it when your CPU supports it."
          fi

          cat > notes.md <<EOF
          Automatic build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}.

          ## Windows

          Windows packages are in-place zip files: extract and run \`lichii.exe\`, or \`eden-cli.exe\` from a terminal.

          $({
            row "amd64 / x86_64" "$(link zip lichii-windows-x86_64.zip)" "$(link "PGO zip" lichii-windows-x86_64-pgo.zip)" "Both built with clang-cl and ThinLTO; the PGO zip adds a profile trained on Ocarina of Time"
          } | table)

          ${pgo_note}
          EOF

          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "Lichii ${GITHUB_REF_NAME} build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md

      # LICHII_BUILD_TAG is baked into every binary as build-<run number>, and the update checker
      # compares release tags against it. A release whose tag or title names another run would be
      # skipped or offered wrongly, so fail the run instead of leaving it published.
      - name: Verify the release tag matches the run number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="build-${GITHUB_RUN_NUMBER}"
          published_tag=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')
          published_title=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')
          if [ "$published_tag" != "$expected" ] || [[ "$published_title" != *" build ${GITHUB_RUN_NUMBER} ("* ]]; then
            echo "Release is tagged '$published_tag' and titled '$published_title', expected tag $expected and a title naming build ${GITHUB_RUN_NUMBER}"
            exit 1
          fi
